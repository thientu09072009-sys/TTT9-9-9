<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CHÚA TỂ SCT</title>
<style>*{box-sizing:border-box}body{margin:0;background:#09020d;color:#fff;font-family:Arial}.app{max-width:560px;margin:auto;padding:10px;background:radial-gradient(circle at top,#510d49,#09020d 75%);min-height:100vh}h1{text-align:center;color:#ffd34e;font-size:23px}.top,.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.box,.panel{background:#1a0b25;border:1px solid #71305d;border-radius:11px;padding:8px;text-align:center}.small{font-size:10px;color:#cbb1ca}.num{font-weight:900}.jp{margin:8px 0;text-align:center;padding:10px;border:1px solid #e2ad39;border-radius:13px;background:#3a0b24}.jp b{font-size:22px;color:#ffd34e}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#110713;border:2px solid #d9952c;border-radius:15px;padding:7px}.cell{height:60px;border-radius:8px;border:2px solid #d5a747;background:linear-gradient(#fff,#cbb8ca);color:#26091d;display:flex;align-items:center;justify-content:center;font-size:26px}.special{background:linear-gradient(#ffe66e,#d76c15)!important}.win{animation:p .35s infinite alternate}@keyframes p{to{transform:scale(1.08);filter:brightness(1.5)}}button,input{border:0;border-radius:9px;padding:10px;margin:3px;font-weight:bold}button{background:#63305e;color:#fff}.spin{width:100%;font-size:20px;background:linear-gradient(#ffcf51,#d45b08);color:#250d00}.active{background:#d67b12!important}.row{display:flex;flex-wrap:wrap;justify-content:center}.note{text-align:center;color:#bca8bd;font-size:10px;margin-top:8px}.msg{text-align:center;color:#ffd95b;min-height:24px}</style></head>
<body><div class="app"><h1>👑 CHÚA TỂ SCT — QUỶ THƯỞNG</h1>
<div class="top"><div class="box"><div class="small">ĐIỂM</div><div id="points" class="num">0</div></div><div class="box"><div class="small">LƯỢT</div><div id="spins" class="num">0</div></div><div class="box"><div class="small">THẮNG LỚN</div><div id="best" class="num">0</div></div></div>
<div class="jp">🏆 HŨ ĐIỂM<br><b id="pot">100.000.000</b></div>
<div class="panel"><div class="small">MỨC ĐIỂM</div><div id="bet" class="num">10.000</div><div id="bets" class="row"></div></div>
<div class="row"><button onclick="redeemUI()">🎁 NHẬP CODE</button><button onclick="auto(10)">AUTO 10</button><button onclick="auto(30)">AUTO 30</button><button onclick="auto(50)">AUTO 50</button><button onclick="auto(1000)">AUTO 1000</button><button onclick="stopAuto()">⏹ DỪNG</button></div>
<div id="grid" class="grid"></div><div id="msg" class="msg">Nhập code điểm ảo để bắt đầu.</div><div id="multi" class="row"></div>
<button id="spin" class="spin" onclick="spin()">QUAY 😈</button>
<div class="note">🛠️ Liên hệ fix: <b>0814160903 (Zalo)</b><br>Game sử dụng điểm ảo, không nạp/rút và không quy đổi thành tiền thật.</div></div>
<script>
const S=["👹","😈","👺","☠️","🔥","🩸","👿","TTT"],M=[1,2,4,8,16,32,64,128,256,512,1028],B=[10000,50000,200000,500000,1000000,2000000];let p=0,s=0,b=10000,pot=100000000,busy=false,c=0,autoLeft=0;
const $=x=>document.getElementById(x),fmt=x=>Math.floor(x).toLocaleString("vi-VN");
let dev=localStorage.getItem("sctDevice");if(!dev){dev=crypto.randomUUID?crypto.randomUUID():"dev-"+Math.random().toString(36).slice(2);localStorage.setItem("sctDevice",dev)}
function render(){ $("points").textContent=fmt(p);$("spins").textContent=s;$("best").textContent=fmt(window.best||0);$("pot").textContent=fmt(pot);$("bet").textContent=fmt(b);$("bets").innerHTML=B.map(x=>`<button class="${x==b?'active':''}" onclick="setB(${x})">${fmt(x)}</button>`).join("");$("multi").innerHTML=M.map((x,i)=>`<span style="padding:4px 6px;margin:2px;border-radius:6px;background:${i==Math.min(c,10)?'#d67b12':'#28102f'}">${x}×</span>`).join("")}
function setB(x){if(!busy&&x<=p){b=x;render()}}
function fill(){for(let i=0;i<30;i++){let x=$("c"+i);x.textContent=S[Math.floor(Math.random()*S.length)];x.className="cell"+(x.textContent=="TTT"?" special":"")}}
function wins(){let v=[...Array(30)].map((_,i)=>$("c"+i).textContent),w=new Set();for(let r=0;r<6;r++)for(let i=0;i<=2;i++){let a=r*5+i;if(v[a]==v[a+1]&&v[a]==v[a+2]&&v[a]!="TTT"){w.add(a);w.add(a+1);w.add(a+2)}}return [...w]}
function cascade(){let w=wins();if(!w.length)return false;w.forEach(i=>$("c"+i).classList.add("win"));let gain=b*M[Math.min(c,10)];p+=gain;window.best=Math.max(window.best||0,gain);$("msg").textContent=`🔥 Cascade ${c+1}: +${fmt(gain)} điểm`;setTimeout(()=>{w.forEach(i=>{$("c"+i).textContent=S[Math.floor(Math.random()*S.length)];$("c"+i).className="cell"});c++;render();setTimeout(()=>{if(c<11&&cascade()){}else finish()},220)},300);return true}
function finish(){busy=false;$("spin").disabled=false;render();if(autoLeft>0){autoLeft--;if(p>=b)setTimeout(spin,180);else{autoLeft=0;$("msg").textContent="Hết điểm.";}}}
function spin(){if(busy)return;if(p<b){$("msg").textContent="Không đủ điểm.";autoLeft=0;return}busy=true;$("spin").disabled=true;p-=b;s++;pot+=Math.floor(b*.1);c=0;fill();render();setTimeout(()=>{if(!cascade()){finish()}},350)}
function auto(n){if(busy||p<b){$("msg").textContent="Không đủ điểm để bắt đầu auto.";return}autoLeft=n;spin()}
function stopAuto(){autoLeft=0;$("msg").textContent="Đã dừng Auto."}
async function redeemUI(){let code=prompt("Nhập code:");if(!code)return;let r=await fetch("/api/redeem",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,deviceId:dev})});let d=await r.json();$("msg").textContent=d.ok?`✅ +${fmt(d.reward)} điểm`:"❌ "+d.error;if(d.ok){p+=d.reward;render()}}
$("grid").innerHTML=[...Array(30)].map((_,i)=>`<div id="c${i}" class="cell">?</div>`).join("");render();fill();
</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CHÚA TỂ SCT</title>
<link rel="stylesheet" href="style.css"></head>
<body><div class="app"><h1>👑 CHÚA TỂ SCT — QUỶ THƯỞNG</h1>
<div class="top"><div class="box"><div class="small">ĐIỂM</div><div id="points" class="num">0</div></div><div class="box"><div class="small">LƯỢT</div><div id="spins" class="num">0</div></div><div class="box"><div class="small">THẮNG LỚN</div><div id="best" class="num">0</div></div></div>

<div class="panel"><div class="small">MỨC ĐIỂM</div><div id="bet" class="num">10.000</div><div id="bets" class="row"></div></div>
<div class="row"><button onclick="redeemUI()">🎁 NHẬP CODE</button><button onclick="auto(10)">AUTO 10</button><button onclick="auto(30)">AUTO 30</button><button onclick="auto(50)">AUTO 50</button><button onclick="auto(1000)">AUTO 1000</button><button onclick="stopAuto()">⏹ DỪNG</button></div>

<button id="spin" class="spin" onclick="spin()">QUAY 😈</button>
